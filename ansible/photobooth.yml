# Based on https://www.willhaley.com/blog/debian-fullscreen-gui-kiosk/
- name: set up the kiosk
  hosts: all
  tasks:
    - name: create kiosk user
      become: yes
      user:
        name: kiosk
        shell: /bin/bash
        home: /home/kiosk
        createhome: yes
    - name: install required kiosk packages
      become: yes
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - xorg
        - chromium
        - openbox
        - lightdm
    - name: edit lightdm config script to enable autologin
      become: yes
      ansible.builtin.copy:
        src: lightdm.conf
        dest: /etc/lightdm/lightdm.conf
        owner: root
        group: root
        mode: 0644
      notify:
        - reboot
    - name: create parent directory for autostart script
      become: yes
      file:
        path: /home/kiosk/.config/openbox
        state: directory
        owner: kiosk
        group: kiosk
    - name: create kiosk user autostart script
      become: yes
      template:
        src: autostart.j2
        dest: /home/kiosk/.config/openbox/autostart
        owner: kiosk
        group: kiosk
        mode: 0644
      vars:
        kiosk_site: "http://localhost"
      notify:
        - reboot
  handlers:
    - name: reboot
      become: yes
      ansible.builtin.reboot: 
